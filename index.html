
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f5">
<title>卡牌批次裁切工具 V1</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f5f5f5;
  color: #222;
}

main {
  max-width: 600px;
  margin: auto;
}

.panel {
  background: white;
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 16px;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #222;
  color: white;
  font-size: 16px;
  font-weight: 600;
  margin-top: 10px;
}

button:disabled {
  opacity: .4;
}

input {
  font: inherit;
}

input[type=file],
input[type=range] {
  width: 100%;
  margin: 12px 0;
}

.muted {
  color: #777;
  font-size: 13px;
  line-height: 1.5;
}

progress {
  width: 100%;
  height: 16px;
  margin-top: 12px;
}

.preview {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.item {
  background: #eee;
  border-radius: 10px;
  overflow: hidden;
  font-size: 12px;
}

.item img {
  display: block;
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: contain;
}

.item div {
  padding: 8px;
  overflow-wrap: anywhere;
}

#status {
  white-space: pre-wrap;
  font-size: 13px;
  line-height: 1.6;
  margin-top: 12px;
}
</style>
</head>

<body>
<main>

<h1>卡牌批次裁切工具</h1>
<p class="muted">V1 測試版｜照片只在目前裝置本機處理，不會上傳。</p>

<section class="panel">
  <h3>1. 選擇照片</h3>
  <input id="files" type="file" accept="image/*" multiple>
  <div id="fileInfo" class="muted">尚未選擇照片</div>
  <div id="preview" class="preview"></div>
</section>

<section class="panel">
  <h3>2. 卡牌佔比設定</h3>

  <label>
    卡牌寬度佔輸出圖片比例：
    <strong id="ratioLabel">70%</strong>
  </label>

  <input type="range" id="ratio" min="40" max="90" value="70">

  <p class="muted">
    例如 70% 代表卡牌寬度約佔輸出圖片的 70%。
  </p>
</section>

<section class="panel">
  <h3>3. 批次處理</h3>

  <button id="start" disabled>開始裁切</button>

  <progress id="progress" value="0" max="100"></progress>

  <div id="status">正在等待 OpenCV 載入...</div>

  <button id="download" disabled>下載 ZIP</button>
</section>

</main>

<script>
window.Module = {
  onRuntimeInitialized() {
    cvReady = true;
    updateStartButton();
    setStatus('OpenCV 載入完成，可以選擇照片。');
    console.log('OpenCV Runtime 初始化完成');
  }
};
</script>
<script src="./libs/opencv.js"></script>
<script src="./libs/jszip.min.js"></script>

<script>
'use strict';

const $ = id => document.getElementById(id);

const OUTPUT_W = 1200;
const OUTPUT_H = 1600;

let selectedFiles = [];
let previewURLs = [];
let zipBlob = null;
let cvReady = false;
let processing = false;

/* =========================
   OpenCV 初始化
========================= */

async function initOpenCV() {
  try {
    let instance = window.cv;

    if (instance && typeof instance.then === 'function') {
      instance = await instance;
      window.cv = instance;
    }

    if (!instance || typeof instance.Mat !== 'function') {
      throw new Error('找不到 OpenCV Mat');
    }

    cvReady = true;

    updateStartButton();

    setStatus('OpenCV 載入完成，可以選擇照片。');

    console.log('OpenCV 初始化成功');

  } catch (error) {
    cvReady = false;

    setStatus('OpenCV 載入失敗：' + error.message);

    console.error(error);
  }
}

function setStatus(message) {
  $('status').textContent = message;
}

/* =========================
   照片選擇與預覽
========================= */

function clearPreview() {
  previewURLs.forEach(url => URL.revokeObjectURL(url));
  previewURLs = [];

  $('preview').innerHTML = '';
}

function updateStartButton() {
  $('start').disabled =
    !cvReady || !window.JSZip || selectedFiles.length === 0 || processing;
}

$('ratio').addEventListener('input', () => {
  $('ratioLabel').textContent = $('ratio').value + '%';
});

$('files').addEventListener('change', event => {
  clearPreview();

  selectedFiles = Array.from(event.target.files || []);

  zipBlob = null;

  $('download').disabled = true;

  $('fileInfo').textContent =
    `已選擇 ${selectedFiles.length} 張照片`;

  selectedFiles.slice(0, 4).forEach(file => {
    const url = URL.createObjectURL(file);

    previewURLs.push(url);

    const item = document.createElement('div');
    item.className = 'item';

    const img = document.createElement('img');
    img.src = url;

    const label = document.createElement('div');
    label.textContent = file.name;

    item.append(img, label);

    $('preview').appendChild(item);
  });

  if (selectedFiles.length > 4) {
    const more = document.createElement('p');
    more.className = 'muted';
    more.textContent = `另外還有 ${selectedFiles.length - 4} 張照片`;
    $('preview').appendChild(more);
  }

  updateStartButton();
});

/* =========================
   載入圖片
========================= */

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();

    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(img);
    };

    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('圖片讀取失敗'));
    };

    img.src = url;
  });
}


function normalizeCardOrientation(canvas) {
  const src = cv.imread(canvas);
  const gray = new cv.Mat();
  const blurred = new cv.Mat();
  const edges = new cv.Mat();
  const closed = new cv.Mat();
  const contours = new cv.MatVector();
  const hierarchy = new cv.Mat();

  const kernel = cv.getStructuringElement(
    cv.MORPH_RECT,
    new cv.Size(9, 9)
  );

  try {
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

    cv.GaussianBlur(
      gray, blurred, new cv.Size(5, 5), 0
    );

    cv.Canny(blurred, edges, 15, 45);

    cv.morphologyEx(
      edges, closed, cv.MORPH_CLOSE, kernel
    );

    cv.findContours(
      closed, contours, hierarchy,
      cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE
    );

    const imageArea = src.cols * src.rows;
    const candidates = [];

    for (let i = 0; i < contours.size(); i++) {
      const contour = contours.get(i);

      try {
        const rect = cv.boundingRect(contour);
        const area = rect.width * rect.height;
        const aspect = rect.width / rect.height;

        if (area < imageArea * 0.08) continue;

        const isPortrait =
          aspect >= 0.55 && aspect <= 0.90;

        const isLandscape =
          aspect >= 1.10 && aspect <= 1.85;

        if (!isPortrait && !isLandscape) continue;

        const rectangularity =
          cv.contourArea(contour) / area;

        if (
          rectangularity < 0.55 &&
          area < imageArea * 0.35
        ) continue;

        candidates.push({
          ...rect,
          area,
          rectangularity,
          orientation: isLandscape
            ? 'landscape'
            : 'portrait'
        });

      } finally {
        contour.delete();
      }
    }

    if (!candidates.length) {
      return {
        canvas,
        rotated: false,
        orientation: 'unknown'
      };
    }

    candidates.sort((a, b) => b.area - a.area);

    const best = candidates[0];

    console.log('方向辨識：', best);

    if (best.orientation === 'portrait') {
      return {
        canvas,
        rotated: false,
        orientation: 'portrait'
      };
    }

    // 橫式：順時針旋轉 90 度
    // 適用於掛耳位於左側的照片
    const rotatedCanvas = document.createElement('canvas');

    rotatedCanvas.width = canvas.height;
    rotatedCanvas.height = canvas.width;

    const ctx = rotatedCanvas.getContext('2d');

    ctx.translate(rotatedCanvas.width, 0);
    ctx.rotate(Math.PI / 2);
    ctx.drawImage(canvas, 0, 0);

    return {
      canvas: rotatedCanvas,
      rotated: true,
      orientation: 'landscape'
    };

  } finally {
    src.delete();
    gray.delete();
    blurred.delete();
    edges.delete();
    closed.delete();
    contours.delete();
    hierarchy.delete();
    kernel.delete();
  }
}

/* =========================
   OpenCV 卡牌矩形偵測
========================= */

function getCardContour(canvas) {
  const src = cv.imread(canvas);
  const gray = new cv.Mat();
  const blurred = new cv.Mat();
  const edges = new cv.Mat();
  const closed = new cv.Mat();
  const contours = new cv.MatVector();
  const hierarchy = new cv.Mat();

  const kernel = cv.getStructuringElement(
    cv.MORPH_RECT,
    new cv.Size(9, 9)
  );

  const candidates = [];

  try {
    // 1. 影像前處理
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

    cv.GaussianBlur(
      gray,
      blurred,
      new cv.Size(5, 5),
      0
    );

    cv.Canny(blurred, edges, 15, 45);

    cv.morphologyEx(
      edges,
      closed,
      cv.MORPH_CLOSE,
      kernel
    );

    // 2. 尋找輪廓
    cv.findContours(
      closed,
      contours,
      hierarchy,
      cv.RETR_LIST,
      cv.CHAIN_APPROX_SIMPLE
    );

    const imageArea = src.cols * src.rows;

    for (let i = 0; i < contours.size(); i++) {
      const contour = contours.get(i);

      try {
        const rect = cv.boundingRect(contour);

        const boxArea = rect.width * rect.height;
        const aspect = rect.width / rect.height;

        // 排除太小或比例不合理的輪廓
        if (
          boxArea < imageArea * 0.08 ||
          aspect < 0.55 ||
          aspect > 0.90
        ) {
          continue;
        }

        const contourArea = cv.contourArea(contour);
        const rectangularity = contourArea / boxArea;

        // 完整矩形可通過；
        // 大型不完整輪廓也保留供保護套辨識
        if (
          rectangularity < 0.55 &&
          boxArea < imageArea * 0.35
        ) {
          continue;
        }

        candidates.push({
          x: rect.x,
          y: rect.y,
          width: rect.width,
          height: rect.height,
          area: boxArea,
          rectangularity
        });

      } finally {
        contour.delete();
      }
    }

    // 3. 沒有候選框
    if (candidates.length === 0) {
      console.log('找不到商品候選矩形');
      return null;
    }

    // 4. 先依面積排序
    candidates.sort((a, b) => b.area - a.area);

    console.table(
      candidates.slice(0, 10).map(c => ({
        x: c.x,
        y: c.y,
        width: c.width,
        height: c.height,
        rectangularity:
          c.rectangularity.toFixed(3)
      }))
    );

    // 5. 以最大候選框為基礎
    const largest = candidates[0];

    // 找出左右邊界接近的候選框
    const related = candidates.filter(c => {
      const leftDiff = Math.abs(
        c.x - largest.x
      );

      const rightDiff = Math.abs(
        (c.x + c.width) -
        (largest.x + largest.width)
      );

      return (
        leftDiff < largest.width * 0.08 &&
        rightDiff < largest.width * 0.08
      );
    });

    // 6. 合併相關候選框
    const left = Math.min(
      ...related.map(c => c.x)
    );

    const right = Math.max(
      ...related.map(c => c.x + c.width)
    );

    const candidateBottom = Math.max(
      ...related.map(c => c.y + c.height)
    );

    const searchBottom = Math.min(
      ...related.map(c => c.y)
    );

    // 7. 搜尋上方水平邊緣
    const topEdges = [];

    const scanLeft = Math.max(
      0,
      Math.round(
        left + (right - left) * 0.1
      )
    );

    const scanRight = Math.min(
      edges.cols,
      Math.round(
        right - (right - left) * 0.1
      )
    );

    for (let y = 0; y < searchBottom; y += 2) {
      let count = 0;

      for (
        let x = scanLeft;
        x < scanRight;
        x += 2
      ) {
        if (edges.ucharPtr(y, x)[0] > 0) {
          count++;
        }
      }

      topEdges.push({ y, count });
    }

    topEdges.sort(
      (a, b) => b.count - a.count
    );

    console.table(topEdges.slice(0, 10));

    // 8. 修正商品主體上緣
    let top = searchBottom;

    const strongest = topEdges[0]?.count || 0;

    const detectedTop = topEdges.find(edge =>
      edge.y > canvas.height * 0.05 &&
      edge.y < searchBottom - largest.height * 0.05 &&
      edge.count >= strongest * 0.60 &&
      edge.count >= 20
    )?.y;

    if (detectedTop !== undefined) {
      const gap = searchBottom - detectedTop;

      if (
        gap > largest.height * 0.03 &&
        gap < largest.height * 0.20
      ) {
        top = detectedTop;
      }
    }

    // 9. 組合最終矩形
    const result = {
      x: Math.round(left),
      y: Math.round(top),
      width: Math.round(right - left),
      height: Math.round(candidateBottom - top)
    };

    console.log('合併後商品主體：', result);
    console.log('相關候選框數量：', related.length);

    return result;

  } finally {
    // 10. 釋放 OpenCV 記憶體
    src.delete();
    gray.delete();
    blurred.delete();
    edges.delete();
    closed.delete();
    contours.delete();
    hierarchy.delete();
    kernel.delete();
  }
}

/* =========================
   單張圖片裁切
========================= */


async function processOne(file) {
  const img = await loadImage(file);

  let canvas = null;
  let rotatedCanvas = null;
  let output = null;
  let landscapeCanvas = null;

  try {
    // 1. 建立原始照片 Canvas
    canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;

    const originalCtx = canvas.getContext('2d');
    originalCtx.drawImage(img, 0, 0);

    // 2. 自動判斷方向
    const normalized = normalizeCardOrientation(canvas);

    console.log('方向判斷結果：', {
      orientation: normalized.orientation,
      rotated: normalized.rotated
    });

    if (normalized.orientation === 'unknown') {
      return {
        success: false,
        reason: '無法判斷卡牌方向'
      };
    }

    const workCanvas = normalized.canvas;

    // 記錄額外建立的旋轉 Canvas
    if (normalized.rotated) {
      rotatedCanvas = workCanvas;
    }

    // 3. 辨識商品主體
    const rect = getCardContour(workCanvas);
    
    if (rect) {
      const debugCanvas = document.createElement('canvas');

      debugCanvas.width = workCanvas.width;
      debugCanvas.height = workCanvas.height;

      const debugCtx = debugCanvas.getContext('2d');

      // 畫出原始照片（橫式照片會先轉成直式）
      debugCtx.drawImage(workCanvas, 0, 0);

      // 畫出商品主體辨識框
      debugCtx.strokeStyle = 'red';
      debugCtx.lineWidth = 8;

      debugCtx.strokeRect(
        rect.x,
        rect.y,
        rect.width,
        rect.height
      );

      // 顯示除錯圖片
      const debugImage = new Image();

      debugImage.src = debugCanvas.toDataURL('image/jpeg', 0.9);
      debugImage.style.maxWidth = '100%';
      debugImage.style.height = 'auto';

      document.body.appendChild(debugImage);

      // 釋放暫存 Canvas
      debugCanvas.width = 0;
      debugCanvas.height = 0;
    }

    console.log('工作圖片尺寸：',
      workCanvas.width,
      workCanvas.height
    );

    console.log('偵測到的商品主體：', rect);

    if (!rect) {
      return {
        success: false,
        reason: '找不到符合條件的卡牌矩形'
      };
    }

    // 4. 讀取商品佔比
    const targetRatio = Number($('ratio').value) / 100;

    if (
      !Number.isFinite(targetRatio) ||
      targetRatio <= 0 ||
      targetRatio > 1
    ) {
      return {
        success: false,
        reason: '商品佔比設定不正確'
      };
    }

    // 5. C 模式：
    // 商品主體寬度與高度都不超過設定佔比
    const scale = Math.min(
      (OUTPUT_W * targetRatio) / rect.width,
      (OUTPUT_H * targetRatio) / rect.height
    );

    const sourceW = OUTPUT_W / scale;
    const sourceH = OUTPUT_H / scale;

    const centerX = rect.x + rect.width / 2;
    const centerY = rect.y + rect.height / 2;

    console.log('裁切比例檢查：', {
      設定佔比: targetRatio * 100 + '%',
      實際寬度佔比:
        (rect.width * scale / OUTPUT_W * 100).toFixed(2) + '%',
      實際高度佔比:
        (rect.height * scale / OUTPUT_H * 100).toFixed(2) + '%',
      裁切來源寬度: sourceW,
      裁切來源高度: sourceH
    });

    // 6. 確認原圖背景足夠
    const EPS = 0.001;

    if (
      sourceW > workCanvas.width + EPS ||
      sourceH > workCanvas.height + EPS
    ) {
      return {
        success: false,
        reason: '裁切範圍大於原始照片，背景留白不足'
      };
    }

    if (
      rect.width > sourceW + EPS ||
      rect.height > sourceH + EPS
    ) {
      return {
        success: false,
        reason: '設定佔比過大，無法完整保留商品主體'
      };
    }

    // 7. 計算允許的裁切位置
    // 確保商品主體不會被裁掉
    const minX = Math.max(
      0,
      rect.x + rect.width - sourceW
    );

    const maxX = Math.min(
      rect.x,
      workCanvas.width - sourceW
    );

    const minY = Math.max(
      0,
      rect.y + rect.height - sourceH
    );

    const maxY = Math.min(
      rect.y,
      workCanvas.height - sourceH
    );

    if (
      minX > maxX + EPS ||
      minY > maxY + EPS
    ) {
      return {
        success: false,
        reason: '照片周圍留白不足，無法完整保留商品主體'
      };
    }

    // 8. 優先置中，必要時微調裁切框
    const sx = Math.max(
      minX,
      Math.min(centerX - sourceW / 2, maxX)
    );

    const sy = Math.max(
      minY,
      Math.min(centerY - sourceH / 2, maxY)
    );

    console.log('裁切位置檢查：', {
      sx,
      sy,
      sourceW,
      sourceH,
      原圖寬度: workCanvas.width,
      原圖高度: workCanvas.height,
      商品中心X: centerX,
      商品中心Y: centerY
    });

    // 9. 先產生直式裁切圖片
    output = document.createElement('canvas');
    output.width = OUTPUT_W;
    output.height = OUTPUT_H;

    const outputCtx = output.getContext('2d');

    outputCtx.imageSmoothingEnabled = true;
    outputCtx.imageSmoothingQuality = 'high';

    outputCtx.drawImage(
      workCanvas,
      sx,
      sy,
      sourceW,
      sourceH,
      0,
      0,
      OUTPUT_W,
      OUTPUT_H
    );

    // 10. 原本是橫式卡牌：
    // 將直式裁切結果逆時針旋轉 90 度
    if (normalized.rotated) {
      landscapeCanvas = document.createElement('canvas');
      landscapeCanvas.width = OUTPUT_H;
      landscapeCanvas.height = OUTPUT_W;

      const landscapeCtx =
        landscapeCanvas.getContext('2d');

      landscapeCtx.translate(
        0,
        landscapeCanvas.height
      );

      landscapeCtx.rotate(-Math.PI / 2);

      landscapeCtx.drawImage(output, 0, 0);

      // 後續以橫式 Canvas 輸出
      const oldOutput = output;
      output = landscapeCanvas;
      landscapeCanvas = null;

      oldOutput.width = 0;
      oldOutput.height = 0;
    }

    // 11. 轉成 JPEG
    const blob = await new Promise(resolve => {
      output.toBlob(
        resolve,
        'image/jpeg',
        0.92
      );
    });

    if (!blob) {
      return {
        success: false,
        reason: 'JPEG 輸出失敗'
      };
    }

    console.log('輸出完成：', {
      width: output.width,
      height: output.height,
      rotated: normalized.rotated
    });

    return {
      success: true,
      blob
    };

  } catch (error) {
    console.error('圖片處理失敗：', error);

    return {
      success: false,
      reason: error?.message || '圖片處理發生未知錯誤'
    };

  } finally {
    // 12. 釋放記憶體
    img.src = '';

    if (canvas) {
      canvas.width = 0;
      canvas.height = 0;
    }

    if (rotatedCanvas) {
      rotatedCanvas.width = 0;
      rotatedCanvas.height = 0;
    }

    if (output) {
      output.width = 0;
      output.height = 0;
    }

    if (landscapeCanvas) {
      landscapeCanvas.width = 0;
      landscapeCanvas.height = 0;
    }
  }
}

/* =========================
   批次處理
========================= */

$('start').addEventListener('click', async () => {
  if (processing || !cvReady || !selectedFiles.length) return;

  processing = true;

  updateStartButton();

  $('download').disabled = true;

  $('progress').value = 0;

  zipBlob = null;

  const zip = new JSZip();

  const failures = [];

  let successCount = 0;

  try {
    for (let i = 0; i < selectedFiles.length; i++) {
      const file = selectedFiles[i];

      setStatus(
        `正在處理 ${i + 1} / ${selectedFiles.length}\n${file.name}`
      );

      try {
        const result = await processOne(file);

        if (result.success) {
          const name = file.name.replace(/\.[^.]+$/, '');

          zip.file(`${name}_裁切.jpg`, result.blob);

          successCount++;

        } else {
          failures.push(`${file.name}：${result.reason}`);
        }

      } catch (error) {
        failures.push(`${file.name}：${error.message}`);

        console.error(error);
      }

      $('progress').value =
        ((i + 1) / selectedFiles.length) * 100;

      // 讓瀏覽器有機會更新畫面
      await new Promise(resolve => setTimeout(resolve, 20));
    }

    if (successCount > 0) {
      setStatus('正在打包 ZIP...');

      zipBlob = await zip.generateAsync({
        type: 'blob'
      });

      $('download').disabled = false;
    }

    setStatus(
      `處理完成！\n` +
      `成功：${successCount} 張\n` +
      `失敗：${failures.length} 張\n\n` +
      (failures.length ? failures.join('\n') : '全部成功')
    );

  } catch (error) {
    setStatus('批次處理發生錯誤：' + error.message);

    console.error(error);

  } finally {
    processing = false;

    updateStartButton();
  }
});

/* =========================
   ZIP 下載
========================= */

$('download').addEventListener('click', () => {
  if (!zipBlob) return;

  const url = URL.createObjectURL(zipBlob);

  const a = document.createElement('a');

  a.href = url;
  a.download = '卡牌裁切結果.zip';

  a.click();

  setTimeout(() => {
    URL.revokeObjectURL(url);
  }, 3000);
});

/* =========================
   Service Worker
========================= */

if (
  'serviceWorker' in navigator &&
  location.protocol.startsWith('http')
) {
  navigator.serviceWorker.register('./sw.js')
    .catch(error => {
      console.error('Service Worker 註冊失敗：', error);
    });
}

</script>
